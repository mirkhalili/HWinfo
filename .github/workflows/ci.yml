name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hwinfo
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: CSV contract
        run: php tests/CsvImportServiceTest.php sample/hardware-info.csv
      - name: Database schema
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: hwinfo
          DB_USER: root
          DB_PASS: root
        run: mysql -h127.0.0.1 -uroot -proot < database/schema.sql
